[workspace]
resolver = "2"
# `default-members` keeps `cargo build` / `cargo test` at the root working on a
# machine with no cmake, no Vulkan SDK and no driver. The backend crates are
# built explicitly with `-p stormbreaker`.
default-members = [
    "crates/adam",
    "crates/chassis",
    "crates/forge",
    "crates/grind",
    "crates/stormbreaker",
]
members = [
    "crates/adam",
    "crates/chassis",
    "crates/forge",
    "crates/grind",
    "crates/stormbreaker",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unhuman-engine/unhuman-rs.git"

[workspace.dependencies]
adam = { path = "crates/adam" }
chassis = { path = "crates/chassis" }
forge = { path = "crates/forge" }
grind = { path = "crates/grind" }
stormbreaker = { path = "crates/stormbreaker" }