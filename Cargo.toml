[workspace]
resolver = "2"
# `default-members` keeps `cargo build` / `cargo test` at the root working on a
# machine with no cmake, no Vulkan SDK and no driver. The backend crates are
# built explicitly with `-p stormbreaker`.
default-members = [
    "crates/UHE/src/core",
    "crates/UHE/src/rhi",
    "crates/UHE/src/shaders",
    "crates/UHE/src/jobs",
    "crates/UHE/platform/vulkan",
]
members = [
    "crates/UHE/src/core",
    "crates/UHE/src/rhi",
    "crates/UHE/src/shaders",
    "crates/UHE/src/jobs",
    "crates/UHE/platform/vulkan",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unhuman-engine/unhuman-rs.git"

[workspace.dependencies]
adam = { path = "crates/UHE/src/core" }
chassis = { path = "crates/UHE/src/rhi" }
forge = { path = "crates/UHE/src/shaders" }
grind = { path = "crates/UHE/src/jobs" }
stormbreaker = { path = "crates/UHE/platform/vulkan" }