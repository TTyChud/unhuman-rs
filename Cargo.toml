[workspace]
resolver = "2"
# `default-members` keeps `cargo build` / `cargo test` at the root working on a
# machine with no cmake, no Vulkan SDK and no driver. The backend crates are
# built explicitly with `-p stormbreaker`.
default-members = [
    "UHE/src/core",
    "UHE/src/engine",
    "UHE/src/rhi",
    "UHE/src/shaders",
    "UHE/src/jobs",
    "UHE/src/vault",
    "UHE/src/renderer",
    "UHE/src/ecs",
    "UHE/src/physics",
    "UHE/src/audio",
    "UHE/src/ui",
    "UHE/src/events",
    "UHE/platform/eyes",
    "UHE/Stormbreaker/vulkan",
    "UHE/Stormbreaker/wgpu",
]
members = [
    "UHE/src/core",
    "UHE/src/engine",
    "UHE/src/rhi",
    "UHE/src/shaders",
    "UHE/src/jobs",
    "UHE/src/vault",
    "UHE/src/renderer",
    "UHE/src/ecs",
    "UHE/src/physics",
    "UHE/src/audio",
    "UHE/src/ui",
    "UHE/src/events",
    "UHE/platform/eyes",
    "UHE/Stormbreaker/vulkan",
    "UHE/Stormbreaker/wgpu",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/unhuman-engine/unhuman-rs.git"

[workspace.dependencies]
adam = { path = "UHE/src/core" }
chassis = { path = "UHE/src/rhi" }
eyes = { path = "UHE/platform/eyes" }
forge = { path = "UHE/src/shaders" }
grind = { path = "UHE/src/jobs" }
stormbreaker = { path = "UHE/Stormbreaker/vulkan" }
stormglass = { path = "UHE/Stormbreaker/wgpu" }
vault = { path = "UHE/src/vault" }
bifrost = { path = "UHE/src/renderer" }
meats = { path = "UHE/src/ecs" }
femur = { path = "UHE/src/physics" }
wire = { path = "UHE/src/audio" }
mirror = { path = "UHE/src/ui" }
pings = { path = "UHE/src/events" }