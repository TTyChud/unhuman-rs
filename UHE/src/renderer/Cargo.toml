[package]
name = "bifrost"
description = "Renderer frontend. Backend-neutral: never names vk:: or wgpu::."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
chassis = { workspace = true }
grind = { workspace = true }

# The repo's canonical math crate (`docs/TRANSFER.md` §1), already the same
# version `vault` and `femur` take, so a `vault::Vertex` position and a
# `bifrost::Camera` translation are the same type and the scene loader needs no
# conversion at the renderer boundary.
#
# Absent on purpose: `ash`, `wgpu`, `stormbreaker`, `stormglass`, `vault`. The
# first four would break the one rule this crate exists to enforce; `vault` is a
# Phase 3 concern (geometry upload) and is reached through handles and bounds,
# not through its types, so the dependency arrow stays one-way.
glam = "0.34"
