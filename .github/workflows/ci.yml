name: CI

# Two platforms, because the C++ engine supported both and this one will too.
#
# The Linux jobs carry the weight: lavapipe means the Vulkan backend is genuinely
# exercised, every commit. The Windows job proves something narrower and is
# labelled honestly -- a GitHub Windows runner has no Vulkan driver, so it builds
# and runs the logic suites and nothing that touches the backend.
#
# That is still worth minutes per commit. Platform-specific breakage is
# invisible from Linux until it lands: a `#[cfg]` that silently excludes a file, a
# path separator assumption, an `unsafe` block that only misbehaves on one
# allocator. Compile-only is not "working", but it is not nothing.
#
# When Windows gets a real backend test, it needs a driver the runner can see.
# That is the job to add then, not a row to widen now.
#
# Six jobs, and the split is not cosmetic.
#
# `logic` needs no GPU at all and runs everywhere, as does `smoke`, which asks
# the build questions a first `cargo build` would surface. `parity` checks the
# port's own claim -- every C++ file has a Rust counterpart or a recorded reason
# it does not -- and is the one job that checks out a second repository. `vulkan`
# runs the backend against Mesa's **lavapipe**, a software Vulkan implementation,
# with the Khronos validation layer loaded. That is not a mock: it is the same
# driver interface, the same validation layer and the same validation rules, on a
# CPU.
#
# Without lavapipe the backend suite would only ever run on someone's machine,
# which is how nine real bugs survived for the length of this project. A gate that
# only runs where a GPU happens to be attached is not a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# One shell for every job, so the Linux and Windows runs of the same command
# behave the same. The one Windows step that is a PowerShell script asks for
# `pwsh` itself.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Warnings are errors, in CI and in the gate script, so a new one fails rather
  # than becoming one more line in a log nobody reads.
  RUSTFLAGS: "-D warnings"

jobs:
  logic:
    name: logic (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install system libraries
        # The `audio` crate binds ALSA through `alsa-sys`, whose build script
        # probes `alsa` with pkg-config. The runner has the runtime library but
        # not the `-dev` headers, so the probe fails and the build stops.
        #
        # The editor's window needs two more, and both are the `-dev` kind the
        # runner image leaves out. `gpui_linux` declares
        # `#[link(name = "xkbcommon")]` and `#[link(name = "xkbcommon-x11")]`, so
        # those `.so` symlinks have to exist at link time; `zed-font-kit` binds
        # fontconfig through `yeslogic-fontconfig-sys`, whose build script runs
        # `pkg-config fontconfig` and stops when `fontconfig.pc` is absent.
        # `libfontconfig1-dev` pulls in freetype as well, which keeps
        # `freetype-sys` from falling back to compiling its vendored copy.
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests that need no driver
        run: cargo test -p grind -p chassis -p forge

      # Cheap and worth it: the workspace must resolve without cmake, a Vulkan
      # SDK or a driver, which is the property that lets a contributor clone and
      # run the tests on a laptop.
      - name: Workspace builds with no Vulkan SDK
        run: cargo build --workspace --all-targets

  smoke:
    name: smoke (build shapes)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same ALSA, fontconfig and xkbcommon headers as `logic`: `build_smoke`
      # builds the whole workspace, editor included.
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev

      # `adam` is where the build questions live: its `build_smoke` suite runs the
      # workspace with all targets, in release, `--locked`, and the doc tests, and
      # asserts the member list. A build question asked by a test is still a build
      # question, and this is the job that asks them. It is separate from `logic`
      # so a red run names the failure -- a compile shape, not a behaviour.
      - name: Build questions
        run: cargo test -p adam

  parity:
    name: parity (C++ coverage)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The repository's claim is that nothing was left behind in the rewrite, and
      # a claim like that is worth exactly as much as the check behind it -- which
      # needs the tree it checks against. Cloned as a sibling, the layout
      # `scripts/parity.sh` defaults to, so the default path itself is exercised.
      # Shallow: the walk reads the working tree, and no submodule is under it.
      - name: Check out the C++ tree alongside
        run: git clone --depth 1 https://github.com/unhuman-engine/UNHUMAN.git ../UNHUMAN

      - name: Every C++ file is ported, or has a recorded reason
        run: ./scripts/parity.sh

  vulkan:
    name: vulkan (lavapipe + validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Vulkan loader, lavapipe and the validation layer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev \
            libfontconfig1-dev \
            libxkbcommon-dev \
            libxkbcommon-x11-dev \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan1 \
            spirv-tools
          # Prove the software driver is actually there, and find it rather than
          # guess its name: Mesa 25.2.8 (noble-updates) ships `lvp_icd.json`,
          # the older release ships `lvp_icd.x86_64.json`. A silent no-op here
          # produces a job that "passes" having tested nothing, which is the
          # exact failure this project already had once.
          icd=$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' | head -1)
          if [ -z "$icd" ]; then
            echo "::error::No lavapipe ICD under /usr/share/vulkan/icd.d"
            ls -la /usr/share/vulkan/icd.d
            exit 1
          fi
          echo "lavapipe ICD: $icd"
          echo "VK_ICD_FILENAMES=$icd" >> "$GITHUB_ENV"

      - name: Show the device lavapipe reports
        run: vulkaninfo --summary

      # The shader-dependent backend tests compile `.slang` through `slangc`, and
      # `forge` tries `SLANGC` first. The C++ tree vendored this exact version
      # (2026.11) but this repository does not, and a shader test with no compiler
      # panics rather than skipping -- deliberately: a skip reports success, which
      # is the failure this repository already paid for once. Pinned, so the
      # SPIR-V the tests compile is the same bytes every run.
      - name: Install the Slang compiler
        run: |
          curl -sSL -o slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v2026.11/slang-2026.11-linux-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/slang"
          tar xzf slang.tar.gz -C "$RUNNER_TEMP/slang"
          echo "SLANGC=$RUNNER_TEMP/slang/bin/slangc" >> "$GITHUB_ENV"

      - name: Full gate
        env:
          # `VK_ICD_FILENAMES` comes from the install step: lavapipe, not
          # whatever the runner happens to have. A GPU on a shared runner is
          # not reproducible; a software rasterizer is.
          UHE_VALIDATION: "1"
          # Serial. The suites share one device and one scratch directory, and
          # under load in CI they collide.
          RUST_TEST_THREADS: "1"
        run: ./scripts/gate.sh --serial

      - name: Validation errors must be zero
        env:
          UHE_VALIDATION: "1"
        run: |
          # Printed as an artefact on failure. A validation error names a VUID
          # and nothing else, so without the surrounding output it is close to
          # unactionable.
          cargo test --workspace -- --test-threads=1 --nocapture 2>&1 \
            | tee validation.log
          # The Khronos layer's format, not any line containing the words. wgpu
          # prints its own "Validation Error" from a deliberately corrupt-shader
          # test (`stormglass`), and that is not a Vulkan validation error.
          count=$(grep -cE 'Validation Error: \[' validation.log || true)
          echo "validation errors: $count"
          if [ "$count" != "0" ]; then
            echo "::error::Validation reported $count error(s). See the log."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
          if-no-files-found: ignore

  windows:
    name: windows (build + logic tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace builds with all targets
        run: cargo build --workspace --all-targets

      - name: Release build
        run: cargo build --workspace --release

      # No Vulkan on this runner, so `--no-vulkan`. The backend suites skip
      # rather than fail here, which is the honest outcome: this job is about
      # the platform, not the driver.
      - name: Logic tests
        # `gate.ps1` is PowerShell, so it needs `pwsh` (the default bash would
        # mangle the path) and PowerShell switch syntax: `-NoVulkan`, not
        # `--no-vulkan`, which PowerShell reads as a positional argument.
        shell: pwsh
        run: .\scripts\gate.ps1 -NoVulkan

  shaders:
    name: shaders (regenerate and diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # See the note in the `vulkan` job. `compile.sh` reads `SLANGC`.
      - name: Install the Slang compiler
        run: |
          curl -sSL -o slang.tar.gz \
            https://github.com/shader-slang/slang/releases/download/v2026.11/slang-2026.11-linux-x86_64.tar.gz
          mkdir -p "$RUNNER_TEMP/slang"
          tar xzf slang.tar.gz -C "$RUNNER_TEMP/slang"
          echo "SLANGC=$RUNNER_TEMP/slang/bin/slangc" >> "$GITHUB_ENV"

      # The checked-in .spv files are what the test suite actually loads, and
      # they are generated by a compiler nobody re-runs by hand. A shader edit
      # that forgets to regenerate leaves the suite testing the old bytes and
      # still green.
      #
      # `compile.sh` rebuilds every .slang in assets/shaders, so this covers
      # each shader individually rather than the one that happened to exist when
      # this step was written.
      - name: Fail if the checked-in SPIR-V is stale
        run: |
          assets/shaders/compile.sh
          if ! git diff --quiet -- assets/shaders; then
            echo "::error::The checked-in SPIR-V does not match its .slang source."
            git diff -- assets/shaders || true
            exit 1
          fi
          echo "checked-in SPIR-V is current"