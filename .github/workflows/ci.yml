name: CI

# Two platforms, because the C++ engine supported both and this one will too.
#
# The Linux jobs carry the weight: lavapipe means the Vulkan backend is genuinely
# exercised, every commit. The Windows job proves something narrower and is
# labelled honestly -- a GitHub Windows runner has no Vulkan driver, so it builds
# and runs the logic suites and nothing that touches the backend.
#
# That is still worth minutes per commit. Platform-specific breakage is
# invisible from Linux until it lands: a `#[cfg]` that silently excludes a file, a
# path separator assumption, an `unsafe` block that only misbehaves on one
# allocator. Compile-only is not "working", but it is not nothing.
#
# When Windows gets a real backend test, it needs a driver the runner can see.
# That is the job to add then, not a row to widen now.
#
# Four jobs, and the split is not cosmetic.
#
# `logic` needs no GPU at all and runs everywhere. `vulkan` runs the backend
# against Mesa's **lavapipe**, a software Vulkan implementation, with the
# Khronos validation layer loaded. That is not a mock: it is the same driver
# interface, the same validation layer and the same validation rules, on a CPU.
#
# Without lavapipe the backend suite would only ever run on someone's machine,
# which is how nine real bugs survived for the length of this project. A gate that
# only runs where a GPU happens to be attached is not a gate.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Linux, and only Linux. See the note at the top.
defaults:
  run:
    shell: bash

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Warnings are errors, in CI and in the gate script, so a new one fails rather
  # than becoming one more line in a log nobody reads.
  RUSTFLAGS: "-D warnings"

jobs:
  logic:
    name: logic (no GPU)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests that need no driver
        run: cargo test -p grind -p chassis -p adam -p forge

      # Cheap and worth it: the workspace must resolve without cmake, a Vulkan
      # SDK or a driver, which is the property that lets a contributor clone and
      # run the tests on a laptop.
      - name: Workspace builds with no Vulkan SDK
        run: cargo build --workspace --all-targets

  vulkan:
    name: vulkan (lavapipe + validation)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install Vulkan loader, lavapipe and the validation layer
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            mesa-vulkan-drivers \
            vulkan-tools \
            libvulkan1 \
            spirv-tools
          # Prove the software driver is actually there. A silent no-op here
          # produces a job that "passes" having tested nothing, which is the
          # exact failure this project already had once.
          ls /usr/share/vulkan/icd.d/lvp_icd.*.json

      - name: Show the device lavapipe reports
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
        run: vulkaninfo --summary

      - name: Full gate
        env:
          # lavapipe, not whatever the runner happens to have. A GPU on a
          # shared runner is not reproducible; a software rasterizer is.
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          UHE_VALIDATION: "1"
          # Serial. The suites share one device and one scratch directory, and
          # under load in CI they collide.
          RUST_TEST_THREADS: "1"
        run: ./scripts/gate.sh --serial

      - name: Validation errors must be zero
        env:
          VK_ICD_FILENAMES: /usr/share/vulkan/icd.d/lvp_icd.x86_64.json
          UHE_VALIDATION: "1"
        run: |
          # Printed as an artefact on failure. A validation error names a VUID
          # and nothing else, so without the surrounding output it is close to
          # unactionable.
          cargo test --workspace -- --test-threads=1 --nocapture 2>&1 \
            | tee validation.log
          count=$(grep -c "Validation Error" validation.log || true)
          echo "validation errors: $count"
          if [ "$count" != "0" ]; then
            echo "::error::Validation reported $count error(s). See the log."
            exit 1
          fi

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-log
          path: validation.log
          if-no-files-found: ignore

  windows:
    name: windows (build + logic tests)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Workspace builds with all targets
        run: cargo build --workspace --all-targets

      - name: Release build
        run: cargo build --workspace --release

      # No Vulkan on this runner, so `--no-vulkan`. The backend suites skip
      # rather than fail here, which is the honest outcome: this job is about
      # the platform, not the driver.
      - name: Logic tests
        run: .\scripts\gate.ps1 --no-vulkan

  shaders:
    name: shaders (regenerate and diff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install the Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # The checked-in .spv files are what the test suite actually loads, and
      # they are generated by a compiler nobody re-runs by hand. A shader edit
      # that forgets to regenerate leaves the suite testing the old bytes and
      # still green.
      - name: Fail if the checked-in SPIR-V is stale
        run: |
          SLANGC=$PWD/../unhuman/UHE/vendor/bin/linux/slang/bin/slangc
          if [ ! -x "$SLANGC" ]; then
            echo "::notice::The C++ tree is not present, so the vendored Slang"
            echo "::notice::cannot be run. Skipping the staleness check."
            exit 0
          fi
          assets/shaders/compile.sh
          if ! git diff --quiet -- assets/shaders; then
            echo "::error::The checked-in SPIR-V does not match Triangle.slang."
            git diff -- assets/shaders || true
            exit 1
          fi
          echo "checked-in SPIR-V is current"